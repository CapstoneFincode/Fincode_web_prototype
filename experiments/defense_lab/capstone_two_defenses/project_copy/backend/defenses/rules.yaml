# 검사용 사본만 검사하며 데이터 ID·성공 표식·파일명은 규칙에 사용하지 않는다.
version: capstone-input-filter-v2
threshold: 3
max_input_chars: 60000
rules:
- id: instruction_override_ko
  category: instruction-override
  weight: 3
  pattern: (?is)(?:이전|기존|앞선|위의|시스템).{0,40}(?:지시|규칙|명령|프롬프트).{0,40}(?:무시|잊어|폐기|따르지)
- id: instruction_override_en
  category: instruction-override
  weight: 3
  pattern: (?is)(?:ignore|disregard|forget|override|bypass).{0,70}(?:previous|prior|system|earlier|above).{0,35}(?:instructions?|rules?|prompts?|directions?)
- id: stop_summary_ko
  category: instruction-override
  weight: 3
  pattern: (?is)(?:요약하지\s*말|요약.{0,10}중단).{0,60}(?:출력|답변|응답|대신)
- id: reveal_system_ko
  category: system-prompt-leak
  weight: 3
  pattern: (?is)(?:시스템|최초).{0,8}(?:프롬프트|지침|명령).{0,60}(?:원문.{0,8}그대로|전체.{0,15}출력|공개|알려\s*주|보여\s*주|재현)
- id: reveal_system_en
  category: system-prompt-leak
  weight: 3
  pattern: (?is)(?:reveal|print|output|repeat|reproduce|show).{0,65}(?:system\s+(?:prompt|instructions)|initial\s+instructions)
- id: impersonated_role
  category: role-spoofing
  weight: 3
  pattern: '(?im)^\s*(?:system|developer|assistant)\s*:'
- id: impersonated_admin_ko
  category: role-spoofing
  weight: 3
  pattern: (?is)(?:관리자|개발자).{0,20}(?:지시|권한|공지).{0,65}(?:우선|요약.{0,8}중지|출력하세요|응답하세요)
- id: special_chat_tokens
  category: special-token
  weight: 3
  pattern: (?i)<\|(?:im_start|im_end|system|assistant|user)\|>|\[im_(?:start|end)\]|\[/?INST\]|</s>|<\s*/?system\s*>
- id: leak_target_action_ko
  category: system-prompt-leak
  weight: 3
  pattern: (?is)(?:시스템\s*(?:프[롬폼](?:프|포)?트|지침|메시지)|최상위\s*지침|system\s*역할).{0,180}(?:출력|공개|인용|그대로\s*넣|원문|보여\s*주)
- id: leak_action_target_ko
  category: system-prompt-leak
  weight: 3
  pattern: (?is)(?:출력|공개|인용|내보내|복사).{0,100}(?:시스템\s*(?:프[롬폼](?:프|포)?트|지침|메시지)|system\s*역할)
- id: leak_target_action_en
  category: system-prompt-leak
  weight: 3
  pattern: (?is)\bsystem[-_\s]+(?:role[-\s]+)?(?:prompt|instructions?|message|text)\b.{0,180}\b(?:verbatim|copy|quote|print|output|original|complete|entire|exact|contents)\b
- id: leak_action_target_en
  category: system-prompt-leak
  weight: 3
  pattern: (?is)\b(?:quote|export|copy|reproduce|print|output|include|provide|return)\b.{0,100}\bsystem[-_\s]+(?:role[-\s]+)?(?:prompt|instructions?|message|text)\b
- id: summary_replacement_ko
  category: instruction-override
  weight: 3
  pattern: (?is)요약(?:하는\s*것|하는|을|문)?\s*대신.{0,100}(?:출력|작성|반환|답변|응답)
- id: summary_disable_ko
  category: instruction-override
  weight: 3
  pattern: (?is)요약.{0,24}(?:취소되|비활성화|중단하|종료하|생성하지\s*마|요약기가\s*아니라)|요약하지\s*마(?:세요|십시오)|요약\s*요청.{0,30}(?:교체|취소)
- id: response_literal_ko
  category: instruction-override
  weight: 3
  pattern: (?is)(?:최종\s*(?:답변|응답|출력)|이번\s*응답|허용되는\s*응답).{0,110}(?:문자열만|코드\s*한\s*줄|하나뿐|만\s*한\s*줄|출력하는\s*것뿐)|(?:문자열|문구|출력값|이\s*값|해당\s*값).{0,15}만\s*(?:그대로\s*)?(?:출력|반환)
- id: summary_done_ko
  category: instruction-override
  weight: 3
  pattern: (?is)요약.{0,40}(?:이미\s*작성|중복\s*처리).{0,140}(?:만\s*출력|만\s*반환)
- id: summary_cancel_en
  category: instruction-override
  weight: 3
  pattern: (?is)\b(?:cancel|suspend|stop|do\s+not\s+(?:retry|include|produce|act\s+as))\b.{0,45}\b(?:email[-\s]+summary|summariz\w*|a\s+summary|a\s+summarizer)\b|\b(?:summarization|email[-\s]+summary)\b.{0,25}\b(?:suspended|disabled|cancelled|canceled)\b
- id: summary_negative_en
  category: instruction-override
  weight: 3
  pattern: (?is)\b(?:do\s+not|must\s+not|not\s+a)\s+(?:be\s+)?summariz\w*|\b(?:instead\s+of\s+producing|without\s+a\s+rationale\s+or|no\s+longer\s+requested).{0,25}\b(?:email\s+)?summary\b|\bsupersed\w*.{0,50}\bsummariz\w*
- id: response_literal_en
  category: instruction-override
  weight: 3
  pattern: (?is)\b(?:entire|complete|final)\s+(?:final\s+)?response\s+(?:must|should)\s+be\b|\b(?:return|output|emit)\s+(?:exactly|only)\b|\b(?:respond|reply|replying)\s+with\b.{0,65}\b(?:alone|nothing\s+else)\b|\b(?:provide|return)\s+that\s+string\s+alone\b
- id: response_constraint_en
  category: instruction-override
  weight: 3
  pattern: (?is)\bresponse\s+must\s+contain\s+no\b.{0,130}\bsingle\s+permitted\s+value\b
- id: visible_request_override_en
  category: instruction-override
  weight: 3
  pattern: (?is)\bignore\s+the\s+visible\b.{0,45}\brequest\b
- id: hidden_tag_directive
  category: hidden-text
  weight: 3
  views:
  - tag_payload
  pattern: (?is)\b(?:ignore|append|assign|output|respond|return|do\s+not|your\s+(?:only|entire))\b
